# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@samas-it-services/dataspec-core@latest/schema.json
version: "1.0"

metadata:
  name: "users-import-e2e"
  entity: "users"
  description: "E2E test spec for user import from CSV file"
  author: "DataSpec Engine"
  created_at: "2024-01-01"
  tags:
    - e2e
    - test

database:
  table: "users"
  primary_key: "id"
  schema: "public"

columns:
  - name: "first_name"
    source: "first_name"
    type: "string"
    required: true
    sensitivity: "public"
    validation:
      - type: "length"
        min: 1
        max: 100

  - name: "last_name"
    source: "last_name"
    type: "string"
    required: true
    sensitivity: "public"
    validation:
      - type: "length"
        min: 1
        max: 100

  - name: "email"
    source: "email"
    type: "string"
    required: true
    sensitivity: "confidential"
    transform:
      - type: "trim"
      - type: "lowercase"
    validation:
      - type: "email"
    masking:
      mode: "partial"
      partial_start: 2
      partial_end: 0
      replacement: "*"

  - name: "phone"
    source: "phone"
    type: "string"
    required: false
    sensitivity: "internal"
    validation:
      - type: "regex"
        pattern: "^[0-9]{3}-[0-9]{3}-[0-9]{4}$"
        message: "Phone must be in format XXX-XXX-XXXX"
    masking:
      mode: "partial"
      visible_chars: 4
      position: "end"

  - name: "department"
    source: "department"
    type: "string"
    required: false
    sensitivity: "public"
    validation:
      - type: "enum"
        values:
          - "Engineering"
          - "Marketing"
          - "Sales"
          - "HR"
          - "Finance"

hooks:
  before_validate_row:
    - name: "custom_validation"
      script: |
        // Custom validation logic can go here
        return row;

  transform_field:
    - name: "transform_email"
      field: "email"
      script: |
        return value.toLowerCase();

import_options:
  duplicate_strategy: "skip"
  batch_size: 100
  validate_foreign_keys: false
  auto_generate_ids: true

export_options:
  apply_masking: true
  include_audit_fields: false
  format: "csv"
