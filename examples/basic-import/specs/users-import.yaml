version: "1.0"
metadata:
  entity: users
  name: User Import
  description: Import user data with transformations and validation
  author: dataspec-engine
  created_at: "2025-12-06"
  tags:
    - users
    - example

database:
  table: users
  primary_key: id

columns:
  - name: first_name
    source: first_name
    type: string
    required: true
    sensitivity: public
    transform:
      - type: trim
      - type: uppercase

  - name: last_name
    source: last_name
    type: string
    required: true
    sensitivity: public
    transform:
      - type: trim

  - name: email
    source: email
    type: string
    required: true
    sensitivity: internal
    transform:
      - type: trim
      - type: lowercase
    validation:
      - type: pattern
        value: "^[\\w.-]+@[\\w.-]+\\.[a-z]{2,}$"
        message: "Invalid email format"

  - name: date_of_birth
    source: date_of_birth
    type: date
    required: false
    sensitivity: confidential
    transform:
      - type: parse_date
        format: YYYY-MM-DD
    masking:
      mode: partial
      visibleChars: 4

  - name: role
    source: role
    type: string
    required: true
    sensitivity: internal
    default: user
    validation:
      - type: enum
        values:
          - admin
          - manager
          - user
          - guest

  - name: department
    source: department
    type: string
    required: false
    sensitivity: public

import_options:
  duplicate_strategy: skip
  batch_size: 100
  validate_foreign_keys: false
  auto_generate_ids: true

export_options:
  apply_masking: true
  include_audit_fields: false
  format: csv
