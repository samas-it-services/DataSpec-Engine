# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@samas-it-services/dataspec-core@latest/schema.json
version: "1.0"

metadata:
  name: "users-import"
  entity: "users"
  description: "Import user data with transformations and validation"
  author: "DataSpec Engine"
  created_at: "2025-12-06"
  tags:
    - users
    - example

database:
  table: "users"
  primary_key: "id"

columns:
  - name: "first_name"
    source: "first_name"
    type: "string"
    required: true
    sensitivity: "public"
    transform:
      - type: "trim"
      - type: "uppercase"

  - name: "last_name"
    source: "last_name"
    type: "string"
    required: true
    sensitivity: "public"
    transform:
      - type: "trim"

  - name: "email"
    source: "email"
    type: "string"
    required: true
    sensitivity: "internal"
    transform:
      - type: "trim"
      - type: "lowercase"
    validation:
      - type: "email"
        message: "Invalid email format"

  - name: "date_of_birth"
    source: "date_of_birth"
    type: "date"
    required: false
    sensitivity: "confidential"
    transform:
      - type: "parse_date"
        format: "YYYY-MM-DD"
    masking:
      mode: "partial"
      visible_chars: 4
      position: "end"

  - name: "role"
    source: "role"
    type: "string"
    required: true
    sensitivity: "internal"
    default: "user"
    validation:
      - type: "enum"
        values:
          - "admin"
          - "manager"
          - "user"
          - "guest"

  - name: "department"
    source: "department"
    type: "string"
    required: false
    sensitivity: "public"

import_options:
  duplicate_strategy: "skip"
  batch_size: 100
  validate_foreign_keys: false
  auto_generate_ids: true

export_options:
  apply_masking: true
  include_audit_fields: false
  format: "csv"
