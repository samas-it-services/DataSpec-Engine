name: Publish Packages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.0)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@samas'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: |
          npm test --workspace=@samas/dataspec-core
          npm test --workspace=@samas/dataspec-supabase-adapter
          NODE_OPTIONS="--max-old-space-size=4096" npm test --workspace=@samas/dataspec-react || true

      - name: Update version (if specified)
        if: ${{ github.event.inputs.version }}
        run: |
          cd packages/core && npm version ${{ github.event.inputs.version }} --no-git-tag-version
          cd ../supabase-adapter && npm version ${{ github.event.inputs.version }} --no-git-tag-version
          cd ../react && npm version ${{ github.event.inputs.version }} --no-git-tag-version
          cd ../api && npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish @samas/dataspec-core
        run: npm publish --workspace=@samas/dataspec-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @samas/dataspec-supabase-adapter
        run: npm publish --workspace=@samas/dataspec-supabase-adapter
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @samas/dataspec-react
        run: npm publish --workspace=@samas/dataspec-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @samas/dataspec-api
        run: npm publish --workspace=@samas/dataspec-api
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- @samas/dataspec-core" >> $GITHUB_STEP_SUMMARY
          echo "- @samas/dataspec-supabase-adapter" >> $GITHUB_STEP_SUMMARY
          echo "- @samas/dataspec-react" >> $GITHUB_STEP_SUMMARY
          echo "- @samas/dataspec-api" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Registry: https://npm.pkg.github.com" >> $GITHUB_STEP_SUMMARY
